[program:{{PROGRAM}}]
process_name=%(program_name)s_%(process_num)02d
command={{PHP}} {{ARTISAN}} queue:work {{QUEUE_CONNECTION}} --sleep=1 --tries=3 --backoff=30 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user={{WEB_USER}}
numprocs={{NUMPROCS}}
redirect_stderr=true
stdout_logfile={{LOG_FILE}}
stopwaitsecs=3600
