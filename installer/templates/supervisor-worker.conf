[program:klinikdent-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/klinikdent/artisan queue:work database --sleep=1 --tries=3 --backoff=30 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/klinikdent/storage/logs/worker.log
stopwaitsecs=3600